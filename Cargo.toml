[workspace.package]
edition      = "2024"
rust-version = "1.85"
license      = "MIT OR Apache-2.0"
publish      = false
authors      = ["Cybernetic Host <bostrom18sd2ujv24ual9c9pshtxys6j8knh6xaead9ye7>"]
description  = "Sovereign nanorobotics control stack with biophysical safety envelopes and neurorights enforcement."
repository   = "https://github.com/mk-bluebird/Augmented-Hub"

[workspace.metadata]
host_did            = "did:vital:bostrom"
bostrom_address     = "bostrom18sd2ujv24ual9c9pshtxys6j8knh6xaead9ye7"
aln_clause          = "ALN.MIGRATION.CYBERCORE_AUTHORITY.v1"
cybercore.authority = "bostrom18sd2ujv24ual9c9pshtxys6j8knh6xaead9ye7"
no-rollback         = true
required-evidences  = 10

[workspace.dependencies]
aes-gcm             = "0.10"
anyhow              = "1.0"
base64              = "0.22"
bcs                 = "0.1"
chrono              = { version = "0.4", features = ["serde"] }
clap                = { version = "4.5", features = ["derive"] }
cookie              = "0.18"
hex                 = "0.4"
http                = "1.0"
kani-verifier       = "0.67"
nalgebra            = "0.32"
once_cell           = "1.19"
ordered-float       = "4.2"
parking_lot         = "0.12"
prometheus          = "0.13"
rand                = "0.8"
regex               = "1.10"
reqwest             = { version = "0.12", features = ["rustls-tls", "cookies", "stream"] }
ring                = "0.17"
serde               = { version = "1.0.203", features = ["derive"] }
serde_cbor          = "0.11"
serde_json          = "1.0.120"
thiserror           = "2.0"
tokio               = { version = "1.42", features = ["full"] }
tracing             = "0.1"
tracing-subscriber  = "0.3"
url                 = "2.5"
uuid                = { version = "1", features = ["serde", "v4"] }

[profile.dev]
opt-level       = 1
debug           = true
overflow-checks = true
panic           = "abort"
incremental     = true

[profile.release]
opt-level       = "z"
lto             = "fat"
codegen-units   = 1
panic           = "abort"
debug           = false
strip           = "symbols"
overflow-checks = true
incremental     = false
