# mk-bluebird/nanorobotics/crates/capillary_density_guard/Cargo.toml
[package]
name = "capillary_density_guard"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mk-bluebird/Cybercore"
description = "Capillary density guard for nanoswarm microvascular corridors and WSS coupling."

[dependencies]
serde = { version = "1.0.203", features = ["derive"] }
serde_json = { version = "1.0.120" }
thiserror = "1.0"
cybernanoviabilitykernel = { path = "../cybernanoviabilitykernel", version = "0.1.0" }
interfaceicsguard = { path = "../interfaceicsguard", version = "0.1.0" }

[dev-dependencies]
kani-verifier = "0.67"
