
[package]
name = "nanoswarm-material-ml"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["mk-bluebird <host@mk-bluebird.org>"]
description = "Candle-based ML pipeline to predict biocompatible nanoswarm materials from MD features, aligned with Organichain rohvalue and immune activation corridors."
repository = "https://github.com/mk-bluebird/Nano-Tree"
homepage = "https://github.com/mk-bluebird/Nano-Tree"
keywords = ["nanoswarm", "materials", "md", "candle", "organichain"]
categories = ["science", "simulation", "machine-learning"]

[lib]
name = "nanoswarm_material_ml"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
candle-core = "0.5"
candle-nn = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"

[dev-dependencies]
kani-verifier = "0.67"

[features]
default = ["governance"]
governance = []

[package.metadata.organichain]
hostdid = "didalnorganic-host"
bostrom_address = "bostrom18sd2ujv24ual9c9pshtxys6j8knh6xaead9ye7"
aln_migration_clause = "ALN.MIGRATION.CYBERCORE_AUTHORITY.v1"
