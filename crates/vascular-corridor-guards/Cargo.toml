[package]
name = "vascular-corridor-guards"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Vascular corridor guards for nanoswarm navigation, including cerebral arterial + capillary density guard."
authors = ["mk-bluebird <host_did=did.aln.organic-host>"]
repository = "https://github.com/mk-bluebird/nanorobotics.git"

[features]
default = ["std"]
std = []
no_std = []

[dependencies]
capillary-density-guard = { path = "../capillary-density-guard" }
serde = { version = "1.0.203", default-features = false, features = ["derive"] }

# If you later add ALN loader integration from Cybercore:
# cybercore-aln-loader = { path = "../../Cybercore/core/aln-loader", optional = true }

[dev-dependencies]
kani = "0.56.0"

[package.metadata.aln]
authority = "ALN.MIGRATION.CYBERCORE_AUTHORITY.v1"
host_did = "did.aln.organic-host"
bostrom_address = "bostrom18sd2ujv24ual9c9pshtxys6j8knh6xaead9ye7"
roh_ceiling_global = "0.30"

[profile.dev]
opt-level = 1
debug = true

[profile.release]
opt-level = 3
debug = false
lto = "fat"
codegen-units = 1
