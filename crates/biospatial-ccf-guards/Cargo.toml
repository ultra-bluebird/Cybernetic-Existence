[package]
name = "biospatial-ccf-guards"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Guard helpers over biospatial CCF organ atlases and unknown-region registries, providing RoH-aware waypoint, thermal, and routing verdicts for nanoswarm planners."
repository = "https://github.com/mk-bluebird/nanorobotics"
homepage = "https://github.com/mk-bluebird/nanorobotics"
documentation = "https://github.com/mk-bluebird/nanorobotics"
readme = false
keywords = [
    "nanorobotics",
    "biospatial",
    "ccf",
    "guards",
    "cybercore",
]
categories = [
    "science",
    "simulation",
]

[lib]
name = "biospatial_ccf_guards"
path = "src/lib.rs"
crate-type = ["rlib"]

[features]
# No optional features; kani is required via dev-dependency and metadata.
default = []

[dependencies]
biospatial-ccf-core = { path = "../biospatial-ccf-core" }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0"
kani = "0.50"

[package.metadata.aln]
hostdid = "did.aln.bostrom-organic-host"
bostromaddress = "bostrom18sd2ujv24ual9c9pshtxys6j8knh6xaead9ye7"
migrationclause = "ALN.MIGRATION.CYBERCORE_AUTHORITY.v1"
authorityrepo = "github.com/mk-bluebird/Cybercore"
rohceiling = "0.30"
nonreversal = "true"
monotonetighteningonly = "true"

[package.metadata.cargo-verify]
kanirequired = true
forbidunsafe = true
rohceiling = "0.30"
