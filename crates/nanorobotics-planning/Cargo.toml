[package]
name = "nanorobotics-planning"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["mk-bluebird <dev@mk-bluebird>"]
description = "Host-sovereign nanoswarm planning and Koopman-based reachability guards for RoH <= 0.30."
readme = false
repository = "https://github.com/mk-bluebird/nanorobotics.git"
categories = ["science", "embedded", "simulation"]
keywords = ["nanorobotics", "nanoswarm", "planning", "koopman", "roh"]

[lib]
name = "nanorobotics_planning"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Cybercore / nanorobotics internal crates (paths assume standard workspace layout)
cybercore-state = { path = "../../Cybercore/crates/cybercore-state" }
cybercore-safety-kernel = { path = "../../Cybercore/crates/cybercore-safety-kernel" }
virtual-supercomputer-sim = { path = "../../Cybercore/crates/virtual-supercomputer-sim" }

# If you already expose shared types (e.g., UnifiedSafetyState7Plus1) from nanorobotics-core,
# you can depend on it here as well.
nanorobotics-core = { path = "../nanorobotics-core" }

[dev-dependencies]
kani = "0.46"

[features]
default = []
# Enable Kani proofs (used by tests/kanikoopman_subset.rs)
kani-verify = []

[package.metadata.aln]
host_did = "did:aln:bostrom-organic-host"
bostrom_address = "bostrom18sd2ujv24ual9c9pshtxys6j8knh6xaead9ye7"
authority_clause = "ALN.MIGRATION.CYBERCORE_AUTHORITY.v1"
roh_ceiling = "0.30"
min_capability_floor = "0.80"
max_roh = "0.30"
