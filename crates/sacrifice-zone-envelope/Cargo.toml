[package]
name = "sacrifice-zone-envelope"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Sacrifice Zone envelopes and guard metrics for hazardous-material regions, wired to Cybercore corridors and nanoswarm guards."
repository = "https://github.com/mk-bluebird/nanorobotics.git"
authors = [ "Augmented Host <bostrom18sd2ujv24ual9c9pshtxys6j8knh6xaead9ye7>"]

[lib]
name = "sacrifice_zone_envelope"
path = "src/lib.rs"

[[bin]]
name = "sacrifice-zone-envelope-cli"
path = "src/main.rs"

[[bin]]
name = "sacrifice-zone-guard-cli"
path = "src/guard_cli.rs"

[features]
default = []
kani = []

[dependencies]
serde = { version = "1.0.203", features = ["derive"] }
serde_json = { version = "1.0.120" }
thiserror = "1.0.63"

cybercore-category = { path = "../../Cybercore/crates/cybercore-category" }
nanorobotics-cbf-guards = { path = "../nanorobotics-cbf-guards" }

[dev-dependencies]
kani = { version = "0.67.0", optional = true }
