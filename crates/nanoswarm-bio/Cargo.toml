# File: crates/nanoswarm-bio/Cargo.toml
# Destination: mk-bluebird/nanorobotics/crates/nanoswarm-bio/Cargo.toml

[package]
name        = "nanoswarm-bio"
version     = "0.1.0"
edition     = "2024"
rust-version = "1.85"
license     = "MIT OR Apache-2.0"
authors     = ["Augmented Host <bostrom18sd2ujv24ual9c9pshtxys6j8knh6xaead9ye7>"]
description = "Biocompatibility, tissue risk, and biospatial envelopes for sovereign nanoswarm control."
repository  = "https://github.com/mk-bluebird/nanorobotics"

[dependencies]
serde       = { version = "1.0.203", features = ["derive"] }
serde_json  = { version = "1.0.120" }

[dev-dependencies]
kani-verifier = "0.67.0"

[features]
default = ["std"]
std     = []
nostd   = []

[lib]
name = "nanoswarm_bio"
path = "src/lib.rs"

[[bin]]
name = "nanoswarm-bio-json-debug"
path = "src/bin/nanoswarm-bio-json-debug.rs"
