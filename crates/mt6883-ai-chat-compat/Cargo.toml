[package]
name = "mt6883-ai-chat-compat"
version = "0.1.0"
edition = "2024"
description = "MT6883 AI-chat compatibility layer for SQLite-first sovereign workspaces"
license = "MIT"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

[dev-dependencies]
kani = { git = "https://github.com/model-checking/kani", branch = "main" }
