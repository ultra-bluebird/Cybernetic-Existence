
[package]
name = "reality_os_core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Reality.os core kernel: Tree-of-Life axes, global RoH scalar, neurorights bitmask, and Kani-verified invariants."
repository = "https://github.com/mk-bluebird/Nano-Tree"
homepage = "https://github.com/mk-bluebird/Nano-Tree"
authors = ["bostrom18sd2ujv24ual9c9pshtxys6j8knh6xaead9ye7"]
publish = false

[lib]
name = "reality_os_core"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
serde = { workspace = true, features = ["derive"] }

nanotree-identity = { path = "../nanotree-identity" }

[features]
default = ["std"]
std = []

[package.metadata.aln]
migrationclause = "ALN.MIGRATION.CYBERCORE_AUTHORITY.v1"
hostdid = "didalnOrganicCPU"
bostromaddress = "bostrom18sd2ujv24ual9c9pshtxys6j8knh6xaead9ye7"
maxroh = 0.30
mincapabilityfloor = 0.80
nondegradingevolution = true
