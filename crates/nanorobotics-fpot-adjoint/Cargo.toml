[package]
name = "nanorobotics-fpot-adjoint"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "FPOTBayes adjoint controllers and latency-aware Fokker–Planck PDE kernels for nanoswarm safety under RoH <= 0.3."
repository = "https://github.com/mk-bluebird/nanorobotics.git"

[package.metadata.cybercore]
host_did = "OrganicCPU"
bostrom_address = "bostrom18sd2ujv24ual9c9pshtxys6j8knh6xaead9ye7"
aln_migration_authority = "ALN.MIGRATION.CYBERCORE_AUTHORITY.v1"

[lib]
name = "nanorobotics_fpot_adjoint"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
serde = { version = "1.0.203", features = ["derive"] }
serde_json = { version = "1.0.120" }

nanorobotics-core = { path = "../nanorobotics-core", features = ["fp", "roh", "biospatial", "sovereignty"] }
advanced-safety-math = { path = "../advanced-safety-math", features = ["fokker-planck", "latency-fp", "bayes-hoststate"] }
aln-governance = { path = "../aln-governance", features = ["provenance", "runtime-mode"] }

[dev-dependencies]
kani = "0.56.0"

[features]
default = ["host_local"]
host_local = []
simulation_only = []
clinical_guarded = []

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false

[workspace]
members = []
