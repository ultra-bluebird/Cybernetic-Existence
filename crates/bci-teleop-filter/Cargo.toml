# mk-bluebird/nanorobotics/crates/bci-teleop-filter/Cargo.toml
[package]
name        = "bci-teleop-filter"
version     = "0.1.0"
edition     = "2024"
license     = "MIT OR Apache-2.0"
description = "Deterministic motion scaling and tremor filtering front-end for BCI-driven nanoswarm shared control."
authors     = ["Augmented Host <bostrom18sd2ujv24ual9c9pshtxys6j8knh6xaead9ye7>"]
repository  = "https://github.com/mk-bluebird/Cybercore"

[lib]
path = "src/lib.rs"

[dependencies]
serde       = { workspace = true }
serde_json  = { workspace = true }
nalgebra    = { workspace = true }
ordered-float = { workspace = true }

[dev-dependencies]
kani_verifier = "0.45"
serde_json    = { workspace = true }
