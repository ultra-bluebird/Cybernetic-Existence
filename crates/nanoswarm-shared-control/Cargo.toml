# mk-bluebird/nanorobotics/crates/nanoswarm-shared-control/Cargo.toml
[package]
name        = "nanoswarm-shared-control"
version     = "0.1.0"
edition     = "2024"
license     = "MIT OR Apache-2.0"
description = "CBF/CLF-based supervisory controller for sovereign nanoswarm shared control with 7D+1 Lyapunov and RoH<=0.3 invariants."
authors     = ["Augmented Host <bostrom18sd2ujv24ual9c9pshtxys6j8knh6xaead9ye7>"]
repository  = "https://github.com/mk-bluebird/nanorobotics"

[lib]
path = "src/lib.rs"

[dependencies]
serde        = { workspace = true }
serde_json   = { workspace = true }
thiserror    = { workspace = true }
anyhow       = { workspace = true }
nalgebra     = { workspace = true }
ordered-float = { workspace = true }

[dev-dependencies]
kani_verifier = "0.45"
serde_json    = { workspace = true }
