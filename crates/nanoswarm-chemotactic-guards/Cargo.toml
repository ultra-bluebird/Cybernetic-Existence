edition     = "2024"
rust-version = "1.85"
license     = "MIT OR Apache-2.0"
description = "Chemotactic nanoswarm shape and vascular non-occlusion guards under Cybercore authority."
authors     = ["Augmented Host <bostrom18sd2ujv24ual9c9pshtxys6j8knh6xaead9ye7>"]
