[package]
name         = "neuro-ad-guard"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.85"
description  = "Alzheimer network-health Lyapunov guard for BCI/EEG and nanoswarm-safe evolution."
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/mk-bluebird/nanorobotics"
readme       = "README.md"
categories   = ["science", "no-std"]
keywords     = ["alzheimers", "bci", "eeg", "safety", "nanorobotics"]

[package.metadata.cybercore]
workspace-root        = true
hostdid               = "OrganicCPU"
bostromaddress        = "bostrom18sd2ujv24ual9c9pshtxys6j8knh6xaead9ye7"
aln-migration-clause  = "ALN.MIGRATION.CYBERCORE_AUTHORITY.v1"

[lib]
name       = "neuro_ad_guard"
path       = "src/lib.rs"
crate-type = ["rlib"]

[features]
default           = ["alloc"]
alloc             = []
std               = []
kani-verification = ["kani"]

[dependencies]
serde = { version = "1.0", default-features = false, features = ["derive"] }

[dev-dependencies]
proptest = "1.5"

[target.'cfg(feature = "kani-verification")'.dependencies]
kani = "0.54"
