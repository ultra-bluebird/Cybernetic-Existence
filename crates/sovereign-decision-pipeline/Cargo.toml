[package]
name = "sovereign-decision-pipeline"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["bostrom18sd2ujv24ual9c9pshtxys6j8knh6xaead9ye7"]
description = "Unified sovereign decision pipeline orchestrating biocompat, cognitive, and evolutionary guards."
repository = "https://github.com/mk-bluebird/nanorobotics"
publish = false

[dependencies]
serde = { version = "1.0.204", default-features = false, features = ["derive"] }
heapless = { version = "0.8", default-features = false }

[features]
default = []
kani = []

[target.'cfg(feature = "kani")'.dependencies]
kani = { version = "0.52.0" }
