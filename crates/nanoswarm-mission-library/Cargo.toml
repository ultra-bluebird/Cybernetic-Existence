# mk-bluebird/nanorobotics/crates/nanoswarm-mission-library/Cargo.toml
[package]
name        = "nanoswarm-mission-library"
version     = "0.1.0"
edition     = "2024"
license     = "MIT OR Apache-2.0"
description = "High-level nanoswarm mission specs and envelope sets under RoH<=0.3 and 7D+1 Lyapunov constraints."
authors     = ["Augmented Host <bostrom18sd2ujv24ual9c9pshtxys6j8knh6xaead9ye7>"]
repository  = "https://github.com/mk-bluebird/nanorobotics"

[lib]
path = "src/lib.rs"

[dependencies]
serde       = { workspace = true }
serde_json  = { workspace = true }
ordered-float = { workspace = true }

[dev-dependencies]
kani_verifier = "0.45"
serde_json    = { workspace = true }
