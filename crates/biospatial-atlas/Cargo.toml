[package]
name = "biospatial-atlas"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Host-centric biospatial atlas for nanoswarm tissue corridors."
repository = "https://github.com/mk-bluebird/Cybercore"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
nalgebra = "0.32"
kani = { version = "0.50", optional = true }

[features]
default = []
formal = ["kani"]
