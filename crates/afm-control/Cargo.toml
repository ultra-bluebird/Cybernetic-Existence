[package]
name = "afm-control"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["mk-bluebird <host@cybercore>"]
description = "Host-local AFM and motion-stage control for nanoswarm-integrated nanorobotics."
repository = "https://github.com/mk-bluebird/nanorobotics.git"

[dependencies]
serde = { version = "1.0.203", features = ["derive"] }
serde_json = { version = "1.0.120" }
tokio = { version = "1.40.0", features = ["rt-multi-thread", "macros"] }
anyhow = "1.0.86"

[dev-dependencies]
kani = { version = "0.56.0" }
