
[package]
name = "nanoswarm_core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Host-sovereign nanoswarm corridor guards, endpoint descriptors, and biospatial RoH aggregation for Nano-Tree / Reality.os."
repository = "https://github.com/mk-bluebird/Nano-Tree"
homepage = "https://github.com/mk-bluebird/Nano-Tree"
authors = ["bostrom18sd2ujv24ual9c9pshtxys6j8knh6xaead9ye7"]
publish = false

[lib]
name = "nanoswarm_core"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }

# Biospatial / physio kernel crates (expected in workspace)
cybernano-physio = { path = "../cybernano-physio" }
cybernano-biospatial = { path = "../cybernano-biospatial" }

[features]
default = ["std"]
std = []

[package.metadata.aln]
migrationclause = "ALN.MIGRATION.CYBERCORE_AUTHORITY.v1"
hostdid = "didalnorganic-host"
bostromaddress = "bostrom18sd2ujv24ual9c9pshtxys6j8knh6xaead9ye7"
maxroh = 0.30
norollback = true
