
[package]
name = "nanorobotics-types"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Shared nanorobotics type definitions for Nano-Tree: hosts, nanoswarms, and biophysical metrics"
repository = "https://github.com/mk-bluebird/Nano-Tree"
authors = ["mk-bluebird <dev@mk-bluebird>"]
readme = "README.md"

[lib]
name = "nanorobotics_types"
path = "src/lib.rs"

[[bin]]
name = "nanorobotics_types_cli"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.120"
chrono = { version = "0.4.38", default-features = false, features = ["clock", "serde"] }
uuid = { version = "1.9.1", features = ["v4", "serde"] }

[dev-dependencies]
kani-verifier = "0.67.0"

[features]
default = ["std"]
std = []

[package.metadata.kani]
config = "kani.conf"
