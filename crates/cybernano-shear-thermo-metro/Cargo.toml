# filename: crates/cybernano-shear-thermo-metro/Cargo.toml

[package]
name = "cybernano-shear-thermo-metro"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["mk-bluebird <bostrom18sd2ujv24ual9c9pshtxys6j8knh6xaead9ye7>"]
description = "FPGA-grade WSS LSM reservoir, nanoswarm-tissue thermodynamics, neurotoxicity RoH, organ-shape manifold metadata, and metabolic Lifeforce ATP corridors for Cybercore nanorobotics."
repository = "https://github.com/mk-bluebird/Cybercore"
keywords = ["nanoswarm", "shear-stress", "thermodynamics", "lifeforce", "BCI"]
categories = ["science", "bioinformatics"]

[lib]
name = "cybernano_shear_thermo_metro"
path = "src/lib.rs"
crate-type = ["rlib"]

[features]
default = ["serde"]
serde = ["dep:serde"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

# Core Cybercore safety and corridor crates (workspace-local paths, versions illustrative).
# These bindings ensure RoH <= 0.30, Tsafe polytopes, and Lifeforce invariants are shared.
bioscale-evidence-registry = { path = "../bioscale-evidence-registry", version = "0.1.0" }
nanoswarm-physio-tsafe      = { path = "../nanoswarm-physio-tsafe",      version = "0.1.0" }
corridor-polytopes          = { path = "../corridor-polytopes",          version = "0.1.0" }
bioscale-energy-ledger      = { path = "../bioscale-energy-ledger",      version = "0.1.0" }
cybernano-guard             = { path = "../cybernano-guard",             version = "0.1.0" }

[dev-dependencies]
serde_yaml = "0.9"
kani = "0.52.0"
