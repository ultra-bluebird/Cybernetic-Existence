[package]
name         = "cargo-domain-lint"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.85"
license      = "MIT OR Apache-2.0"
publish      = false
authors      = [
    "Augmented Citizen <bostrom18sd2ujv24ual9c9pshtxys6j8knh6xaead9ye7>",
    "Data_Lake contributors <neuro@organiccpu.ai>",
]
description  = "Domain / RoH / actuation dependency linter for nanoswarm and nanorobotics crates under Cybercore authority."
repository   = "https://github.com/mk-bluebird/nanorobotics"

[package.metadata.cybercore]
host_did        = "did:vital:bostrom"
bostrom_address = "bostrom18sd2ujv24ual9c9pshtxys6j8knh6xaead9ye7"
migrationclause = "ALN.MIGRATION.CYBERCORE_AUTHORITY.v1"
no_rollback     = true

[dependencies]
anyhow         = "1.0"
cargo_metadata = "0.18"
serde          = { version = "1.0", features = ["derive"] }
serde_json     = "1.0"
thiserror      = "1.0"

[dev-dependencies]
kani-verifier = "0.45"

[features]
default = []
