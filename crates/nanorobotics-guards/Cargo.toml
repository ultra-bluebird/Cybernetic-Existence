# crates/nanorobotics-guards/Cargo.toml

[package]
name         = "nanorobotics-guards"
version      = "0.2.0"
edition      = "2024"
rust-version = "1.85"
license      = "MIT OR Apache-2.0"
description  = "Host-sovereign nanoswarm guard kernels (hemodynamic, lymphatic, valve, RoH emergency, detox lifeforce) and safety invariant guards for nanorobotics."
repository   = "https://github.com/mk-bluebird/nanorobotics"
homepage     = "https://github.com/mk-bluebird/nanorobotics"

[lib]
name       = "nanorobotics_guards"
path       = "src/lib.rs"
crate-type = ["rlib"]

[features]
# Safety and Kani are never feature-gated; std only controls std usage.
default = ["std"]
std     = []

[dependencies]
# Internal nanorobotics workspace crates.
# Paths assume the standard repo layout:
#   nanorobotics/
#     crates/nanorobotics-core
#     crates/nanorobotics-scheduler
#     crates/nanoswarm-telemetry
#     crates/nanorobotics-guards  (this crate)
nanorobotics-core      = { path = "../nanorobotics-core",      version = "0.1.0" }
nanorobotics-scheduler = { path = "../nanorobotics-scheduler", version = "0.1.0" }
nanoswarm-telemetry    = { path = "../nanoswarm-telemetry",    version = "0.1.0" }

# Core deps with explicit versions, matching your global requirements.
serde       = { version = "1.0.203", features = ["derive"] }
serde_json  = { version = "1.0.120" }
thiserror   = { version = "1.0.63" }
once_cell   = { version = "1.19.0" }
base64      = { version = "0.22.0" }
heapless    = { version = "0.8.0" }

[dev-dependencies]
# Kani is required and non-optional for all guard crates.
# Use the precise, non-optional version you specified.
kani          = { version = "0.56.0" }
kani-verifier = { version = "0.67" }

# Workspace dev dependency for randomized tests / harnesses.
rand = { version = "0.8.5" }

[package.metadata.aln]
# Sovereign binding; migration authority must match Cybercore.
hostdid         = "did.aln.bostrom-organic-host"
bostromaddress  = "bostrom18sd2ujv24ual9c9pshtxys6j8knh6xaead9ye7"
migrationclause = "ALN.MIGRATION.CYBERCOREAUTHORITY.v1"

# Global RoH ceiling and monotone evolution invariants.
rohceiling             = "0.30"
norollback             = true
nodowngrade            = true
monotonetighteningonly = true

[package.metadata.cargo-verify]
# CI / verification hints for this crate.
kanirequired = true
forbidunsafe = true
