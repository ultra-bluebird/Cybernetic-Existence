# File: mk-bluebird/nanorobotics/crates/mcp-nanoswarm-gas-tools/Cargo.toml

[package]
name        = "mcp-nanoswarm-gas-tools"
version     = "0.1.0"
edition     = "2024"
rust-version = "1.85"
license     = "MIT OR Apache-2.0"
description = "Read-only MCP tools nanoswarm.gas.check and nanoswarm.gas.estimate for nanoswarm gas feasibility queries."
repository  = "https://github.com/mk-bluebird/nanorobotics"
homepage    = "https://github.com/mk-bluebird/nanorobotics"
documentation = "https://github.com/mk-bluebird/nanorobotics"
authors     = ["mk-bluebird <host@cybercore>"]

[lib]
name       = "mcp_nanoswarm_gas_tools"
path       = "src/lib.rs"
crate-type = ["rlib"]

[features]
default = []

[dependencies]
serde = { version = "1.0.203", features = ["derive"] }
nanoswarm-gas-core = { path = "../nanoswarm-gas-core", version = "0.1.0" }
cybernetic-energy-objects = { path = "../cybernetic-energy-objects", version = "0.1.0" }

[dev-dependencies]
kani = "0.56.0"

[package.metadata.aln]
hostdid        = "did:aln:organic-host"
bostromaddress = "bostrom18sd2ujv24ual9c9pshtxys6j8knh6xaead9ye7"
migrationclause = "ALN.MIGRATION.CYBERCOREAUTHORITY.v1"
authorityrepo  = "github.com/mk-bluebird/Cybercore"
rohceiling     = 0.30
nonreversal    = true
monotonetighteningonly = true
alnclauseids   = ["ALN.MIGRATION.CYBERCOREAUTHORITY.v1"]

[package.metadata.cargo-verify]
