# File: crates/nanoswarm-firebreak/Cargo.toml

[package]
name = "nanoswarm-firebreak"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Nanoswarm firebreak enforcement: ensures biological data never flows to actuation or authorization domains"
repository = "https://github.com/your-org/javasphere"
keywords = ["firebreak", "biological-firewall", "nanoswarm", "sovereignty", "safety"]
categories = ["security", "no-std"]

[lib]
crate-type = ["rlib", "cdylib"]
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"], optional = true }
thiserror = "2.0"

[dev-dependencies]
serde_json = "1.0"

[features]
default = ["serde"]
serde = ["dep:serde"]

[lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
cargo = "warn"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = true
