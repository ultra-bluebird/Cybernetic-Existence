schema_version: "1.0.0"
kind: disturbance-aware-nocturnal-evidence-bridge
status: proposed-integration-contract

attribution:
  anchor: "bostrom18sd2ujv24ual9c9pshtxys6j8knh6xaead9ye7"
  purpose: document-credit-and-workstream-metadata-only
  establishes_identity: false
  grants_consent: false
  grants_authority: false
  proves_execution: false

tracks:
  insect_sampling:
    endpoints:
      - trap-catches
      - non-attracting-observations
    sampling_method_is_potential_intervention: true
    capture_location_equals_origin: false
    universal_sampling_radius: not-assumed

  bat_acoustics:
    endpoints:
      - validated-detection-events
      - protocol-defined-pass-events
      - feeding-buzz-events
    functional_groups: separate-unless-aggregation-is-justified
    recordings_equal_individuals: false
    feeding_attempts_equal_successful_capture: false
    acoustic_presence_establishes_pollination: false

  burrow_monitoring:
    endpoints:
      - installed-structures
      - usable-structures
      - detected-use
      - modeled-occupancy-if-identifiable
      - reproduction
      - survival-or-persistence
    burrow_count_equals_habitat_quality: false
    occupancy_loss_equals_mortality: false
    colonization_equals_population_growth: false

observation_contract:
  required:
    - declared-endpoint
    - count
    - effort
    - effort-unit
    - spatial-support
    - temporal-support
    - protocol
    - weather
    - equipment-state
    - classification-review
    - method-version
    - provenance-revision
    - evidence-class

sampling_conditions:
  metric_type_is_light_exposure_record: false
  trap_light:
    activation_intervals: required-if-used
    spectrum_and_intensity: measured-or-explicitly-unresolved
  ambient_light:
    condition: recorded-or-explicitly-unresolved
  experimental_light:
    condition: recorded-or-not-applicable
  adjacent_dark_habitat:
    comparison_support: declared-if-used

study_design:
  insect_comparisons:
    - pre-activation-non-attracting-observations
    - trap-active-observations
    - post-activation-observations
    - matched-non-trap-comparison
    - adjacent-habitat-observations

  burrow_treatments:
    keep_separate:
      - structure-addition
      - structure-maintenance
      - surrounding-habitat-restoration
      - relocation-or-exclusion

  movement_and_redistribution:
    inference: requires-supporting-observations
    proximity_alone: potential-connectivity-only

interpretation:
  observed_rate:
    meaning: events-per-declared-effort
    detection_corrected: false-unless-separately-modeled
    abundance_established: false
  zero_events:
    means: no-events-recorded-under-declared-protocol
    means_missing_effort: false
    proves_absence: false
  uncertainty:
    status: explicit
    not_estimated: retained-in-summaries
  competing_explanations:
    - ecological-state-change
    - organism-redistribution
    - detection-change
    - effort-change
    - classification-change

validation:
  required:
    - effort-unit-mismatch
    - zero-count-with-valid-effort
    - zero-effort-rejection
    - boolean-count-rejection
    - survey-count-boundary
    - independent-light-condition-record
    - changed-method-and-provenance
    - observed-rate-not-relabeled-as-abundance
    - detected-use-not-relabeled-as-persistence

rights_and_location:
  precise_sensitive_locations: restricted-by-default
  public_generalization: separately-reviewed
  private_physiological_inventory: not-required
  companion_system_inventory: not-required
  accessible_explanation: required
  correction_and_human_review: available

authority:
  analysis_authorizes_trapping: false
  analysis_authorizes_relocation: false
  analysis_authorizes_burrow_installation: false
  analysis_authorizes_habitat_modification: false
  field_operations: separate-permission-and-review-required
  publication: separate-disclosure-review-required

current_claim:
  supported: source-derived-design-synthesis
  code_execution: not-performed-for-this-mutation
  empirical_validation: not-established
  causal_intervention_effect: not-established
  demographic_benefit: not-established
