schema_version: "1.0.0"
kind: rights-preserving-evidence-to-action-bridge
status: proposed-integration-contract

attribution:
  anchor: "bostrom18sd2ujv24ual9c9pshtxys6j8knh6xaead9ye7"
  purpose: document-credit-and-workstream-metadata-only
  grants_identity_verification: false
  grants_consent: false
  grants_authority: false
  proves_execution: false

scope:
  evaluates:
    - paired-service-outcomes
    - minimum-requirement-evidence
    - exact-action-approval-lifecycles
  personal_ranking: forbidden
  identity_legitimacy_assessment: forbidden
  ordinary_assistance_requires_private_disclosure: false

paired_evidence:
  condition_labels:
    - emulation
    - semantic
  condition_definitions: required-before-empirical-use
  outcome_meaning: barrier-present-or-absent
  accepted_values:
    - 0
    - 1
    - null
  pairing_definition: must-be-declared
  barrier_coding_rubric: must-be-declared
  observation_support: must-be-declared
  order_and_carryover: assess-in-comparison-design

  outputs:
    - assigned-pair-count
    - complete-pair-count
    - paired-contingency-cells
    - complete-pair-rate-difference
    - complete-pair-condition-rates
    - cohort-missing-outcome-bounds
    - exact-paired-test-result

  interpretation:
    negative_difference: lower-semantic-barrier-rate
    missing_outcome_bounds: not-confidence-intervals
    statistical_significance: not-practical-benefit
    synthetic_fixture: not-participant-evidence
    effect_confidence_interval: not-calculated-by-supplied-code

minimum_review:
  exact_inventory_required: true
  accepted_findings:
    - pass
    - fail
    - unknown
  aggregation_priority:
    - fail
    - unknown
    - pass

  requirements:
    - alternative_input_task_access
    - accessible_change_notice
    - private_data_exclusion
    - outbound_processing_scope
    - non_interference_boundary
    - settings_upgrade_preservation
    - support_exit_continuity
    - refusal_access_equivalence
    - correction_and_human_fallback
    - claim_evidence_scope

  exhaustive_fixture:
    expected_state_vectors: 59049
    expected_all_pass_vectors: 1
    expected_unresolved_vectors: 1023
    expected_failed_vectors: 58025
    execution_status: not-executed-in-this-response
    actual_requirement_evidence: not-evaluated

  authority:
    release_authorized_by_summary: false
    external_action_authorized_by_summary: false
    service_denial_authorized_by_summary: false

claim_review:
  exact_claim: required
  intended_use: required
  evidence_ancestry: required
  method_version: required
  provenance_revision: required
  missing_evidence: unresolved
  failed_evidence: fail
  changed_evidence: revalidation-required
  explanation_and_correction: remain-available

approval:
  binding_fields:
    - operation
    - target
    - payload
    - scope
    - reviewed_release
  explicit_approval_adapter: required
  reservation: atomic-and-before-dispatch
  action_execution: outside-evidence-analysis
  transition_table: internal-and-not-caller-configurable
  duplicate_reservation: reject
  changed_binding: fresh-approval-required

reconciliation:
  outcomes:
    - completed
    - closed-no-effect
    - outcome-uncertain
    - partial-effect
  uncertain_or_partial_outcome: no-automatic-retry
  reconciliation_evidence: retained-with-reason
  original_approval_restored: false

research_boundaries:
  analysis_path_has_destination_credentials: forbidden
  private_system_control: forbidden
  automatic_publication: forbidden
  hidden_personal_ranking: forbidden
  precise_sensitive_locations: excluded-by-default
  private_physiological_inventory: not-required

validation:
  paired_arithmetic: required
  missing_outcome_cases: required
  malformed_review_inventory: required
  exhaustive_tri_state_classification: required
  altered_action_fields: required
  concurrent_reservation: required
  caller_selected_transition_bypass: required-negative-test
  timeout_and_partial_effect: required
  claim_revalidation: required
  runtime_isolation: requires-separate-deployment-evidence

current_claim:
  supported: architectural-synthesis-and-proposed-integration
  executed_test_claim: not-established
  measured_accessibility_benefit: not-established
  measured_ecological_benefit: not-established
  external_effect: not-performed-in-this-response
