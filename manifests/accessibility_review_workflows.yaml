schema_version: "1.0.0"
kind: accessibility-and-review-quality-test-plan
status: proposed-not-executed

attribution:
  anchor: "bostrom18sd2ujv24ual9c9pshtxys6j8knh6xaead9ye7"
  purpose: document-credit-and-workstream-metadata-only
  grants_authority: false

review_errors:
  categories:
    - scientific
    - provenance
    - privacy
    - access
    - authorization
  multiple_labels_per_case: allowed
  materiality_rubric: prespecified-and-versioned
  independent_judgments: retained-before-adjudication
  adjudication_disagreement: retained
  unresolved_cases: reported
  zero_denominator: typed-undefined
  aggregate_rate_replaces_category_rates: false

accessibility:
  target: WCAG-2.2-AA
  conformance_claim: not-established
  selected_mapping_is_exhaustive: false
  complete_process_evaluation: required
  keyboard_testing: required
  assistive_technology_testing: required
  tested_environment_versions: recorded
  personal_diagnosis_required: false
  private_system_inventory_required: false

workflows:
  correction:
    steps:
      - select-input
      - submit
      - receive-validation-result
      - locate-error
      - understand-correction
      - revise
      - resubmit
      - inspect-result
    missing_or_failed_review_blocks_ordinary_assistance: false

  approval:
    steps:
      - request-action-review
      - inspect-exact-content
      - request-correction-or-decide
      - approve-or-decline
      - receive-reservation-status
      - receive-execution-status
      - reconcile-uncertain-or-partial-outcome
    synthetic_destination_only_for-tests: true

status_policy:
  background_updates_move_focus: false
  explicit_user_navigation_may_move_focus: true
  dialog_focus_management: tested-separately
  qualifying_status_messages: programmatically-determinable
  message_context: complete-and-understandable
  repeated_progress_announcements: bounded-and-user-tested
  source_values_echoed_in_status: forbidden-by-default
  reservation_means_completion: false
  uncertain_outcome_means_failure: false
  uncertain_outcome_enables_automatic_retry: false

acceptance_evidence:
  required:
    - keyboard-task-observations
    - focus-location-before-and-after-updates
    - programmatic-role-and-state-inspection
    - screen-reader-announcement-observations
    - error-location-and-correction-success
    - decline-path-observations
    - uncertain-outcome-comprehension
    - category-specific-review-errors
    - unresolved-and-missing-outcomes

claim_boundary:
  automated_checks_prove_full_conformance: false
  synthetic_tests_prove_user_benefit: false
  fewer_scientific_errors_offset_privacy_or_access_errors: false
  review_results_authorize_external_actions: false
