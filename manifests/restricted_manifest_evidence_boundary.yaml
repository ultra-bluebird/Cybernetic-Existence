schema_version: "1.0.0"
kind: restricted-manifest-evidence-boundary
status: proposed-integration-contract

attribution:
  anchor: "bostrom18sd2ujv24ual9c9pshtxys6j8knh6xaead9ye7"
  purpose: document-credit-and-workstream-metadata-only
  establishes_identity: false
  grants_consent: false
  grants_authority: false
  proves_execution: false

input:
  source: explicitly-selected-local-input
  parser_accepts: already-read-text
  bounded_read_adapter: required-before-parser
  automatic_fetch: forbidden
  automatic_file_discovery: forbidden

representation:
  documents: exactly-one
  root_type: mapping
  empty_root_policy: explicit-schema-decision
  mapping_keys: restricted-simple-strings
  duplicate_keys: reject-before-overwrite
  aliases: forbidden
  anchors: forbidden
  explicit_tags: forbidden
  directives: forbidden
  merge_keys: forbidden
  implicit_reference_resolution: forbidden
  ordinary_url_values: inert-data

scalars:
  interpretation: restricted-json-style-plus-strings
  lowercase_booleans: typed
  plain_null: typed-null
  plain_empty_value: typed-null
  quoted_values: strings
  dates: strings
  legacy_boolean_words: strings
  nonfinite_numeric_results: reject
  language_conformance_claim: restricted-profile-not-full-yaml-core

limits:
  input_utf8_bytes: 65536
  nested_collections: 24
  attached_nodes: 4096
  entries_per_collection: 256
  scalar_characters: 4096
  node_count_includes_mapping_keys: true
  universal_safe_limits: not-claimed
  process_memory_guarantee: not-established
  wall_clock_guarantee: not-established

validation:
  structural_schema: closed
  unknown_fields: reject
  missing_required_fields: reject
  scalar_types: exact
  boolean_integer_coercion: forbidden
  policy_value_checks: separate
  parser_dependency_version: reviewed-and-recorded
  profile_version: recorded
  schema_revision: recorded
  policy_revision: recorded

report:
  required_findings:
    - parsing
    - restricted-feature-compliance
    - resource-limit-compliance
    - structural-schema-compliance
    - policy-value-compliance
  behavior_evidence: separate
  outcome_evidence: separate
  authorization: separate
  field_paths: unambiguous
  private_source_values_in_errors: omit-by-default
  limitations: retained-in-summaries

acceptance_tests:
  required:
    - independently-authored-valid-fixture
    - duplicate-key
    - quoted-unquoted-duplicate-key
    - alias
    - anchor
    - explicit-tag
    - directive
    - multiple-document
    - complex-key
    - unknown-nested-field
    - exact-boolean-type
    - empty-value-null
    - empty-root-policy
    - utf8-byte-boundary
    - depth-boundary
    - node-count-boundary
    - collection-length-boundary
    - scalar-length-boundary
    - malformed-input
    - numeric-overflow
    - parser-version-regression
    - resource-constrained-execution

rights:
  evaluates: manifests-and-research-artifacts
  personal_ranking: forbidden
  private_system_inventory: not-required
  physiological_disclosure: not-required
  accessible_explanation: required
  correction_and_resubmission: available
  rejected_manifest_blocks_ordinary_assistance: false

claim_boundary:
  permitted_scope: declared-ingestion-and-validation-findings
  parsing_proves_runtime_isolation: false
  parsing_proves_privacy_enforcement: false
  parsing_proves_accessibility_conformance: false
  parsing_proves_ecological_benefit: false
  parsing_grants_external_authority: false

current_status:
  code_execution_for_this_mutation: not-performed
  manifest_parsing_for_this_mutation: not-performed
  repository_inspection: not-performed
  repository_modification: not-performed
  persistent_storage: not-performed
  deployment_enforcement: not-established
