schema_version: "1.0.0"
kind: rights-constrained-capability-stewardship-bridge
status: proposed-research-and-governance-contract

attribution:
  anchor: "bostrom18sd2ujv24ual9c9pshtxys6j8knh6xaead9ye7"
  purpose: document-credit-and-workstream-metadata-only
  establishes_identity: false
  establishes_biological_binding: false
  grants_consent: false
  grants_authority: false
  proves_execution: false

scope:
  evaluates:
    - service-designs
    - task-workflows
    - research-artifacts
    - proposed-claims
    - proposed-actions
  personal_ranking: forbidden
  identity_legitimacy_assessment: forbidden
  legal_certification: not-provided
  biological_transformation_claim: not-established

access:
  accommodation_first: true
  diagnosis_required_for_ordinary_assistance: false
  private_system_inventory_required: false
  communication_pacing_respected: true
  accessible_explanation: required
  human_fallback: required
  correction_and_appeal: available

cyberrank:
  personal:
    participation: private-and-voluntary
    registration: not-required
    self_description: respected-without-technical-proof
  governance:
    duties:
      - equal-access
      - minimal-disclosure
      - non-interference
      - accessible-correction
      - material-change-review
  status_scoring: forbidden
  automated_eligibility: forbidden
  authentication_use: forbidden

data:
  collection: allowlisted-for-declared-task
  unrelated_private_fields:
    - neural-telemetry
    - medical-records
    - biometric-records
    - companion-system-details
  unrelated_private_fields_allowed: false
  sensitive_habitat_coordinates: excluded-by-default
  purpose_and_retention: required-per-data-class
  deletion_procedure: required-per-data-class

continuity:
  subject: application-workflow-state-only
  preservation: bounded-by-current-permission
  expiry: explicit
  deletion_requests: honored-through-declared-procedure
  calendar_reset: not-a-state-change-justification
  persistent_storage_claim:
    requires:
      - actual-authorized-storage
      - declared-purpose
      - declared-retention
      - available-deletion-procedure
  physiological_continuity_claim: outside-scope

evidence:
  classes:
    - observed
    - fitted
    - literature-derived
    - synthetic
  ancestry_preserved: true
  method_version: required
  provenance_revision: required
  uncertainty_description: required
  material_revision: revalidation-required

evaluation:
  service_endpoints:
    - accessible-task-completion
    - errors
    - repeated-input-burden
    - unnecessary-disclosure
    - correction-outcomes
    - user-control
  ecological_endpoints:
    - habitat-condition
    - usable-opportunity
    - resource-availability
    - water-use
    - energy-use
    - waste
  per_endpoint_requirements:
    - units
    - desired-direction
    - spatial-or-service-support
    - temporal-support
    - comparison-design
    - uncertainty
    - meaningful-change-threshold
  hidden_scalar_ranking: forbidden
  rights_violation_offset_by_benefit: false
  tradeoffs: report-explicitly

review:
  outcomes:
    - pass
    - fail
    - unresolved
  rights_conflicts:
    documented_alternatives: required
    accountable_review_role: required
    accessible_appeal_route: required
    resolution_requires_reevaluation: true
  scientific_review: exact-claim-and-use-specific
  publication_review: separate
  external_authorization: separate
  blocked_claim_blocks_ordinary_assistance: false

execution:
  default: local-research
  automatic_fetch: forbidden
  automatic_export: forbidden
  private_system_control: forbidden
  hardware_control: forbidden
  exact_action_approval: required
  changed_action_requires_fresh_approval: true
  uncertain_execution_outcome: reconcile-before-retry

demonstration:
  current_claim: architectural-design-contribution
  measured_service_benefit: not-established
  measured_ecological_benefit: not-established
  accessibility_conformance: not-established
  runtime_non_interference: not-verified
  tests_executed_for_this_artifact: false
