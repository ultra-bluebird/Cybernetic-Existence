[package]
name = "sovereign-continuity-ledger"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "A local-first, private-by-default DAG continuity ledger."

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0.120", features = ["derive"] }
serde_json = "1.0.120"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.12"
