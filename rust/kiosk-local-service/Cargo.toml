[package]
name = "kiosk-local-service"
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
license = "MIT OR Apache-2.0"
description = "Read-only, privacy-preserving local service catalog for offline public assistance kiosks."
repository = "https://github.com/mk-bluebird/Augmented-Hub"
readme = "README.md"
keywords = [
    "accessibility",
    "offline",
    "privacy",
    "public-services",
    "sqlite",
]
categories = [
    "accessibility",
    "database",
    "localization",
    "web-programming",
]

[lib]
name = "kiosk_local_service"
path = "src/lib.rs"

[dependencies]
rusqlite = { version = "0.37.0", default-features = false, features = ["bundled", "modern_sqlite"] }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.16"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
dbg_macro = "deny"
panic = "deny"
todo = "deny"
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
