schema_version: "1.0.0"
kind: "WorldSaveApprovalBindingPolicy"
status: "proposed_specification"
license: "MIT OR Apache-2.0"

provenance:
  sovereign_attribution: "bostrom18sd2ujv24ual9c9pshtxys6j8knh6xaead9ye7"
  attribution_use: "document_credit_only"

scope:
  purpose: "Prevent a reviewed approval from being reused for another operation."
  milestone_acceptance_supplies_execution_authority: false
  local_policy_document_authorizes_external_action: false

cryptography:
  enabled: false
  commitment_algorithm: "SHA-256"
  approved_implementation: "sha2"
  canonicalization_profile: null
  enablement_requires_reviewed_implementation_and_profile: true

required_binding_components:
  - "exact_contract_commitment"
  - "exact_configuration_commitment"
  - "exact_payload_commitment"
  - "policy_revision"
  - "operation"
  - "destination"
  - "units_and_limits"
  - "purpose_and_recipient_scope"
  - "validity_window"
  - "protected_configuration_generation"
  - "permitted_use_count"

authority:
  required_person_directed_authorization: "evaluate_separately"
  reviewer_authority: "establish_through_protected_process"
  declared_role_is_authority: false
  raw_neural_or_device_inventory_required: false
  public_personal_identity_required: false

commit_conditions:
  exact_binding_match: "required"
  current_policy_compatibility: "required"
  time_validity_with_uncertainty: "pass_required"
  approval_withdrawal_or_invalidation_check: "required"
  remaining_use_budget: "required"
  resource_owner_enforced_snapshot_or_transaction: "required"

race_handling:
  preflight_check_alone_is_sufficient: false
  configuration_generation_change: "stop_affected_operation_and_review"
  unchanged_digest_after_generation_change: "not_automatic_reauthorization"
  unavailable_atomic_or_conditional_enforcement: "execution_readiness_not_established"
  one_use_approval_consumption: "bind_to_protected_commit_transition"
  timeout_after_possible_effect: "reconcile_before_any_retry"
  rollback_detection: "requires_independent_accepted_continuity_basis"

privacy:
  binding_records_are_anonymous: false
  minimal_metadata: "required"
  access_and_retention_review: "required"
  publication: "separate_exact_payload_approval_required"

rights_boundary:
  failed_action_approval_removes_ordinary_access: false
  uncertainty_removes_correction_route: false
  record_problem_justifies_surveillance: false

implementation_status:
  canonicalization_profile_established: false
  commitments_created: false
  atomic_executor_implemented: false
  race_test_executed_against_live_system: false
