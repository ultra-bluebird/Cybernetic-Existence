registry_entry:
  name: "qualified_correction_completion"
  version: "0.1.0-proposed"
  status: "review_required"
  subject: "institutional_correction_process"
  person_level_use: "prohibited"

attribution:
  anchor: "bostrom18sd2ujv24ual9c9pshtxys6j8knh6xaead9ye7"
  meaning: "document_credit_and_workstream_metadata_only"

definition:
  construct: "qualified_completion_of_due_correction_obligations"
  unit: "proportion"
  valid_range:
    lower: 0
    upper: 1
  direction: "higher_is_better_within_defined_scope"
  interpretation_limit: "not_a_complete_fairness_measure"

population:
  unit_of_analysis: "correction_obligation"
  inclusion: "applicable_obligations_due_by_reporting_cutoff"
  exclusion_requires: "documented_and_reviewable_reason"
  completed_cases_only_denominator: "prohibited"

calculation:
  numerator: >
    Count of included obligations completed by the reporting cutoff
    with accessibility, substantive adequacy, and correction evidence
    established.
  denominator: "count_of_included_due_obligations"
  zero_denominator:
    status: "not_applicable"
    numeric_value: "absent"
  unknown_quality:
    numerator_treatment: "not_confirmed_success"
    separate_count_required: true
  disputed_completion:
    numerator_treatment: "not_confirmed_success"
    separate_count_required: true

time:
  deadline_origin: "original_obligation_intake_or_approved_stage_trigger"
  reporting_cutoff_required: true
  reassignment_resets_deadline: false
  new_plan_erases_prior_breach: false
  on_time_completion: "separate_metric"

required_breakdowns:
  - "communication_channel"
  - "communication_method"
  - "support_arrangement"
  - "correction_task"
  - "unresolved_quality_count"

privacy:
  breakdown_release: "disclosure_review_required"
  private_content_in_labels: "prohibited"
  augmentation_inventory_required: false
  public_participant_ranking: "prohibited"

comparability:
  requires_matching:
    - "construct"
    - "population"
    - "completion_definition"
    - "quality_requirements"
    - "denominator"
    - "time_basis"
    - "missingness_treatment"
  conversion_requires:
    - "documented_transformation"
    - "scope_and_limitations"
    - "independent_review"
  name_equality_is_sufficient: false

prohibited_interpretations:
  - "participant_worth"
  - "participant_credibility"
  - "participant_dangerousness"
  - "augmentation_verification"
  - "service_eligibility"
  - "proof_of_universal_accessibility"
  - "proof_of_legal_compliance"

evidence_status:
  calculation_tests: "not_executed"
  interoperability_tests: "not_executed"
  stakeholder_review: "not_completed"
  operational_validation: "not_completed"
