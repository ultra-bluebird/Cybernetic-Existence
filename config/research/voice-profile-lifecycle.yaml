schema_version: "1.0.0"
document_version: "0.1.0"
kind: voice-profile-lifecycle-policy
status: proposed_not_executed
date_created: "2026-10-31"
date_modified: "2026-10-31"

provenance:
  attribution_anchor: "bostrom18sd2ujv24ual9c9pshtxys6j8knh6xaead9ye7"
  attribution_scope: [credit_metadata, workstream_metadata]
  attestation_claim: none
  persistence_claim: none

choice:
  prior_voice_recreation_required: false
  voice_banking_required_for_communication: false
  nonpersonalized_voice_equally_supported: required
  text_only_option: required
  private_preview_default: true
  preview_recording_default: disabled
  preview_transmission_default: disabled
  automatic_voice_change_on_update: prohibited

data_classes:
  source_recordings:
    authorization: separately_scoped
    retention: explicit_duration_required
    deletion_evidence: required
  speaker_representation:
    authorization: separately_scoped
    export_default: deny
    unrelated_training_default: deny
  personalized_model:
    authorization: separately_scoped
    software_and_preprocessing_version: required
    deletion_or_restriction_status: explicit
  preferences:
    access: person_and_authorized_support_only
    correction: accessible
  generated_audio:
    retention_default: disabled
  transcripts:
    retention_default: disabled
  authorization_records:
    content_minimization: required
    record_integrity: separately_enforced

revocation:
  stop_new_in_scope_operations: required
  preserve_unrelated_communication_permissions: required
  derived_artifacts_follow_declared_lineage: true
  deletion_claim_from_access_denial: prohibited
  downstream_acknowledgment: required_where_applicable
  unverifiable_copies: explicitly_report

authenticity:
  chosen_expression_is_respected: true
  biometric_identity_verification_claim: prohibited
  medical_or_institutional_status_claim: prohibited
  speaker_authentication_reuse: separately_authorized_only

evaluation:
  endpoints:
    - perceived_choice
    - perceived_pressure
    - voice_satisfaction
    - disclosure_comfort
    - communication_success
    - correction_burden
  questionnaire_status: instrument_selection_or_validation_required
  subgroup_attributes_inferred: prohibited
  assistance_to_complete_feedback: available_without_response_coaching

enforcement:
  implemented_by_this_configuration: false
  requires:
    - protected_profile_store
    - current_permission_checks
    - controlled_rendering_boundary
    - accessible_correction_and_appeal
