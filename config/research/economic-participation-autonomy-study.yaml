schema_version: "1.0.0"
document_version: "0.1.0"
kind: economic-participation-autonomy-study
status: proposed_not_executed
date_created: "2026-10-31"

provenance:
  attribution_anchor: "bostrom18sd2ujv24ual9c9pshtxys6j8knh6xaead9ye7"
  scope: [credit_metadata, workstream_metadata]
  execution_evidence: absent
  attestation_claim: none

economics:
  perspectives_reported_separately:
    - resource
    - person_out_of_pocket
    - payer
    - support_time
  currency_and_price_year: required
  resource_quantities_and_unit_costs_separate: required
  double_counting_review: required
  missing_cost_ledger_is_zero: false
  qualifying_service_definition: required
  cost_effectiveness_is_affordability: false
  productivity_determines_access_entitlement: prohibited
  sensitivity_scenarios:
    - device_lifetime
    - recalibration_frequency
    - repair_and_replacement
    - communication_downtime
    - clinical_followup
    - support_time
    - recurring_service_cost
    - discounting
    - delivered_service

outcomes:
  core_domains:
    - participation_ability
    - participation_satisfaction
    - device_related_psychosocial_effect
    - communication_or_mobility_task_success
  additional_domains_selected_with_participants:
    - fatigue
    - agency
    - privacy_comfort
    - correction_burden
  instrument_selection:
    population_and_language_fit: required
    version_and_scoring_recorded: required
    administration_mode_recorded: required
    responsiveness_evidence_reviewed: required
    custom_measure_is_validated_by_default: false
    questionnaire_text_embedded_without_permission: prohibited

administration:
  person_selected_access_method: required
  AAC_self_report_is_self_report: true
  assistance_type_recorded: required
  support_person_supplies_answer_by_default: false
  proxy_measure_separate_from_self_report: true
  rest_pause_and_decline_available: true
  missing_response_is_negative_outcome: false

longitudinal_design:
  baseline: required
  early_use: planned
  stabilized_use: planned
  periodic_followup: participant_informed_schedule
  material_change_review: required
  discontinuation_retained: true
  missingness_and_burden_reported: true

autonomy_review:
  task_and_subtask_defined: required
  proposed_machine_authority_explained: required
  failure_and_disagreement_demonstrated: required
  cancel_undo_and_fallback_demonstrated: required
  trial_of_alternatives: required_where_feasible
  accepted_rejected_unresolved_recorded: required
  selected_defaults_preserved_across_updates: required
  automatic_value_weights: prohibited
  default_is_consent: false
  disagreement_resolved_by_efficiency_score: prohibited

evidence:
  paired_performance_and_agency_results: required
  preference_changes_over_time: reported
  qualitative_explanations: separately_authorized
  raw_private_conversation_required: false
  costs_or_outcomes_used_for_automated_eligibility: prohibited
