schema_version: "1.0.0"
document_version: "0.1.0"
kind: accessible-multilingual-communication-study
status: proposed_not_executed
date_created: "2026-10-31"

provenance:
  attribution_anchor: "bostrom18sd2ujv24ual9c9pshtxys6j8knh6xaead9ye7"
  scope: [credit_metadata, workstream_metadata]
  execution_evidence: absent
  external_registration: none

aims:
  - distinguish_candidate_selection_submission_delivery_and_understanding
  - measure_correction_sequences_without_dropping_unresolved_episodes
  - evaluate_language_specific_meaning_and_selected_expression

interface_requirements:
  candidate_marked_not_sent: required
  confirmation_requires_matching_observed_event: true
  uncertainty_target_named: required
  percent_confidence_display_default: disabled
  cancel_and_correction_accessible: required
  no_color_only_status: required
  no_sound_only_status: required
  automatic_translation: prohibited
  automatic_dialect_standardization: prohibited
  automatic_politeness_rewriting: prohibited
  user_selected_alternatives: supported
  private_preview: supported

participation:
  intended_users_involved_before_final_interface_selection: required
  communication_method_selected_by_person: required
  support_person_participation: separately_chosen
  private_medical_or_neural_inventory_required: false
  infer_cognitive_competence_from_speed_or_grammar: prohibited
  rest_and_pause_available: required
  withdrawal_disables_unrelated_communication: prohibited

language_protocol:
  declared_languages_and_varieties: required_before_collection
  representation_choice_justified_per_language: true
  tokenization_version_recorded: true
  meaning_bearing_tone_stress_and_length_reviewed: true
  native_or_appropriately_fluent_listener_review: required
  code_switching_policy: explicitly_declared
  listener_identity_publication: prohibited
  model_fluency_substitutes_for_semantic_correctness: false

repair_annotations:
  episode_times:
    - breakdown_observed
    - recognition_if_observed
    - repair_started
    - outcome_observed
    - observation_ended
  outcomes:
    - resolved
    - cancelled
    - pending
  action_sequences_retained: true
  independent_coding_subset: preregistered
  coding_disagreements_retained: true
  raw_message_text_required_in_public_report: false

endpoints:
  explanation:
    - comprehension_of_message_status
    - comprehension_of_destination
    - successful_correction_action
    - successful_cancel_action
  communication:
    - meaning_preserved
    - language_specific_intelligibility
    - selected_expression_preserved
  burden:
    - elapsed_observed_time
    - person_active_time
    - action_count
    - input_activations
    - voluntarily_reported_effort
  unresolved_or_cancelled_episodes_excluded_silently: prohibited

evidence:
  split_by_participant_and_session_as_appropriate: required
  interface_order_effects_addressed: required
  uncertainty_and_missingness_reported: true
  instruments:
    established_or_custom_status_declared: required
    custom_instrument_validation_plan: required_if_used
  numeric_acceptance_thresholds:
    source: participant_informed_preregistered_study_plan
    invented_by_this_template: false

data_governance:
  consent_records_separate_from_decoder_outputs: true
  correction_is_training_authorization: false
  minimal_payload_logging: required
  retention_and_export_separately_authorized: true
  public_CyberRank_or_eligibility_output: prohibited
