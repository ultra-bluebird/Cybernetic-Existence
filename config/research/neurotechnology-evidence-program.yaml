program:
  version: "0.1.0-proposed"
  status: "design_review"
  participant_collection: "not_authorized"
  device_intervention: "not_authorized"
  operational_governance_execution: "not_authorized"

attribution:
  anchor: "bostrom18sd2ujv24ual9c9pshtxys6j8knh6xaead9ye7"
  meaning: "document_credit_and_workstream_metadata_only"

sensing_envelope:
  required_dimensions:
    - "acquisition"
    - "retention"
    - "inference"
    - "transmission"
    - "controls"
    - "indicators"
  required_binding:
    - "device_configuration"
    - "firmware_version"
    - "companion_app_version"
    - "operating_state"
    - "observation_method"
    - "observation_limits"
  declaration_is_measurement: false
  encrypted_payload_content: "unverified_without_additional_evidence"

drift_review:
  field_outcomes:
    - "mismatch"
    - "not_contradicted"
    - "unresolved"
  latency_measures:
    - "system_detection"
    - "participant_notification"
    - "effective_control"
  undetected_events: "censored_or_unresolved_not_zero_latency"

consent_evaluation:
  outcomes:
    - "understanding"
    - "choice_fidelity"
    - "refusal_viability"
    - "withdrawal_effectiveness"
    - "burden"
  interaction_count_is_control: false
  behavioral_change_is_automatically_success: false
  real_essential_access_loss: "prohibited_in_experiment"

capability_ledger:
  required_dimensions:
    - "claim"
    - "source_type"
    - "evaluation_protocol"
    - "independence"
    - "reproduction"
    - "scope"
    - "date"
    - "limitations"
  expert_opinion_is_reproduction: false
  publication_type_is_validation: false

risk_registry:
  requires:
    - "enabling_capability"
    - "attacker_access"
    - "auxiliary_information"
    - "deployment_context"
    - "affected_interest"
    - "supporting_evidence"
    - "uncertainty"
  inaccurate_inference_can_cause_harm: true

obligations:
  baseline_rights:
    capability_downgrade_removes_protection: false
    review_deadline_expiry_authorizes_action: false
  capability_dependent:
    trigger_type: "explicit_evidence_predicate"
    revision_requires: "reasoned_authorized_review"
    prior_breaches_preserved: true
    unresolved_remedies_preserved: true

assessment:
  knowledge_factor: {status: "not_scored"}
  eco_impact_value: {status: "not_scored"}
  harm_risk: {status: "not_scored"}
  accessibility_impact: {status: "not_scored"}
  rights_alignment: {status: "not_scored"}
