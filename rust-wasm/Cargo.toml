[package]
name = "augmented-hub-wasm"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Local-first, non-actuating browser evaluation bindings for Augmented-Hub."
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = [
  "cdylib",
  "rlib",
]
path = "src/lib.rs"

[dependencies]
augmented-hub = {
  path = "../rust",
  default-features = false,
  features = [
    "pipeline",
  ],
}
serde = {
  version = "1.0.120",
  features = [
    "derive",
  ],
}
serde_json = "1.0.120"
wasm-bindgen = "0.2.100"
